name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: |
          npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp service-worker.js www/ || true

      - name: Clean Android
        run: rm -rf android

      - name: Install Capacitor 3
        run: |
          npm uninstall @capacitor/core @capacitor/android @capacitor/cli || true
          npm install @capacitor/core@3.9.0 @capacitor/android@3.9.0 @capacitor/cli@3.9.0 typescript@4.5.5

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Android 5 configuration
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 30/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 30/' android/variables.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaegerVisionPro-Android5
          path: android/app/build/outputs/apk/debug/app-debug.apk
