name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build --if-present

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp service-worker.js www/ || true

      - name: Generate Android project
        run: |
          npm install @capacitor/core@3.9.0 @capacitor/android@3.9.0 @capacitor/cli@3.9.0 typescript@4.5.5 --save
          npx cap add android || true
          npx cap sync android

      - name: Configure Android 5.0
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/' android/variables.gradle || true
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 30/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 30/' android/variables.gradle || true
          sed -i 's/java-version: 17/java-version: 11/' .github/workflows/android.yml || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save Android project
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android package.json package-lock.json
          git diff --cached --quiet || git commit -m "Auto generate Android project"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: JaegerVisionPro-Android5
          path: android/app/build/outputs/apk/debug/app-debug.apk
